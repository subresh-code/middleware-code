version: "3.9"

services:
  api:
    build: .
    container_name: payment_api
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - middleware-internal
      - rafiki-shared

  db:
    image: postgres:15
    container_name: payment_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - middleware-internal

  redis:
    image: redis:7-alpine
    container_name: payment_redis
    networks:
      - middleware-internal

networks:
  middleware-internal:
    driver: bridge
  rafiki-shared:
    external: true

volumes:
  postgres_data:
